[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-research"
version = "0.3.0"
description = "Topic-based web and social research with source and coverage tracking"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
scrapling = ["scrapling[fetchers]>=0.4.15; python_version >= '3.10'"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
reach-research = "reach_research.cli:main"
reach-research-web = "reach_research.web:main"

[tool.setuptools.packages.find]
include = ["reach_research*"]

[tool.setuptools.package-data]
reach_research = ["static/*"]
