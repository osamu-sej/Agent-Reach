[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-research"
version = "0.2.0"
description = "Topic-based web and social research with source and coverage tracking"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
scrapling = ["scrapling>=0.3; python_version >= '3.10'"]

[project.scripts]
reach-research = "reach_research.cli:main"

[tool.setuptools.packages.find]
include = ["reach_research*"]
